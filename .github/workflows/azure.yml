name: Airdrop Farmer

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  workflow_dispatch:

jobs:
  farm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: airdrop-farmer:latest

      - name: Run farmer
        run: |
          docker run --rm \
            -e WALLET_PASSWORD="${{ secrets.WALLET_PASSWORD }}" \
            -e TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            -e TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -v ${{ github.workspace }}/wallets.enc:/app/wallets.enc:ro \
            -v ${{ github.workspace }}/config.yaml:/app/config.yaml:ro \
            airdrop-farmer:latest --wallets 10

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update farmer state [skip ci]"
          git push